services:
  - type: web
    name: chat-server
    env: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn --worker-class eventlet -w 1 --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: SECRET_KEY
        scope: shared
        value: your-secret-key-render
      - key: PYTHON_VERSION
        value: 3.11.7
    staticPublicPath: /static
    routes:
      - type: http
        path: /
        middleware: []
