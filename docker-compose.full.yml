version: "3.8"

services:
  chat-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "5000:5000"
    environment:
      - FLASK_APP=app.py
      - SECRET_KEY=your-secret-key-change-in-production
      - WEB_PORT=5000
      - DEBUG=False
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs

  chat-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "12345:12345"
    environment:
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=12345
      - MAX_CONNECTIONS=50
    restart: unless-stopped
    volumes:
      - ./logs:/app/logs
